# Pre-commit hooks. Requires a git repo: run `git init` then
# `pre-commit install` (needs `pip install pre-commit`). Until then, use
# check.bat for the same checks without git.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        # Match the project's pinned numpy so pre-commit, CI, and local mypy
        # all type-check against the same stubs.
        additional_dependencies: [numpy~=1.26]
        pass_filenames: false
